server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA history-mode fallback: serve index.html for any unknown path
    # so deep links like /docs/admin-panel/payment-assets work on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the x402-api backend (running on the host at :8080),
    # so the frontend can use same-origin /api/ URLs and avoid CORS. Active only
    # when config.js leaves FACILITATORS_API_URL / CP0X_SERVICES_API_URL empty;
    # with absolute URLs the browser calls the backend directly and skips this.
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long cache for hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the runtime config or the HTML shell
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
