server {
    listen 80;
    server_name xpaywall.io www.xpaywall.io;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name xpaywall.io www.xpaywall.io;

    ssl_certificate /etc/letsencrypt/live/xpaywall.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xpaywall.io/privkey.pem;

    location / {
        proxy_pass http://host.docker.internal:3100;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Proto $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SPA history-mode fallback:
        # the upstream returns 404 for deep links like
        # /docs/admin-panel/payment-assets — intercept it and
        # serve the app shell instead so vue-router can route client-side.
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }

    location @spa_fallback {
        # proxy_pass cannot carry a URI inside a named location,
        # so set the path with rewrite first, then proxy without one.
        rewrite ^ /index.html break;
        proxy_pass http://host.docker.internal:3100;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Proto $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
